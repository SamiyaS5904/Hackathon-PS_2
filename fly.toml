# Fly.io config for OfferPilot (README -> Deploy -> Fly.io).
# One small machine that is always on: the autopilot sends offers through the day and the bots must keep polling.
# Never scale above 1 machine: two copies of the bots would fight over the same Telegram tokens.

app = "offerpilot-samiya"        # change it if the name is taken (fly will tell you)
primary_region = "sin"           # Singapore (closest region to India on Fly)

[env]
  DB_PATH = "/data/offerpilot.db"

[[mounts]]
  source = "offerpilot_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"     # keep running: offers are scheduled through the day
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
