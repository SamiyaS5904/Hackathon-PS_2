# =====================================================================================================
# CATEGORY BOTS: one Telegram bot per offer category (bot/bots.py)
# -----------------------------------------------------------------------------------------------------
# Every approved offer is sent by the bot of its category (the offer's product/category); offers with no category
# (points, wallet, free delivery on the whole order, reminders) go through the Rewards bot.
# Tokens are secrets: put them in .env under token_env. A bot without a token falls back to the main bot
# (TELEGRAM_BOT_TOKEN), so nothing is lost. The manager must press Start once in each bot so it may message them.
# =====================================================================================================

bots:
  electronics: {name: "OfferPilot Electronics", token_env: TELEGRAM_BOT_TOKEN_ELECTRONICS}
  fashion:     {name: "OfferPilot Fashion",     token_env: TELEGRAM_BOT_TOKEN_FASHION}
  beauty:      {name: "OfferPilot Beauty",      token_env: TELEGRAM_BOT_TOKEN_BEAUTY}
  home:        {name: "OfferPilot Home",        token_env: TELEGRAM_BOT_TOKEN_HOME}
  grocery:     {name: "OfferPilot Grocery",     token_env: TELEGRAM_BOT_TOKEN_GROCERY}
  rewards:     {name: "OfferPilot Rewards",     token_env: TELEGRAM_BOT_TOKEN_REWARDS}
